name: Blooom
description: 'Blooom was an independent robo-advisor that provided automated, flat-fee management of
  employer-sponsored retirement accounts — 401(k), 403(b), 457, and TSP plans — analyzing holdings,
  rebalancing allocations, and flagging hidden fund fees on accounts it advised but did not directly
  custody. Founded in 2013 and backed by QED Investors, the Kansas-based company operated a consumer
  web application rather than a public developer API. The consumer service has since wound down:
  blooom.com no longer resolves to a website and the domain is now served by Morgan Stanley
  nameservers with a locked-down, mail-disabled defensive DNS posture (null MX, SPF -all, DMARC
  p=reject). Retained here as a historical wealth-management profile; no live API or developer surface
  remains to enrich.'
